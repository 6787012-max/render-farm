name: film2srt
run-name: film2srt ${{ inputs.name }}
# English speech-to-text for PUBLIC-DOMAIN films (archive.org). Output: per-part JSON segments as artifacts.
on:
  workflow_dispatch:
    inputs:
      url: { description: 'direct video url', required: true, type: string }
      name: { description: 'short name', required: true, type: string }
      parts: { description: 'number of parallel parts', required: false, type: string, default: '8' }
      model: { description: 'faster-whisper model', required: false, type: string, default: 'small.en' }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        run: python3 -c "import json;print('shards='+json.dumps(list(range(int('${{ inputs.parts }}')))))" >> $GITHUB_OUTPUT
  part:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ inputs.model }}-film-v1
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null && pip install -q faster-whisper==1.1.1 requests
      - name: transcribe part
        env:
          URL: ${{ inputs.url }}
          N: ${{ inputs.parts }}
          I: ${{ matrix.shard }}
          MODEL: ${{ inputs.model }}
        run: |
          curl -sL --retry 5 -o v.mp4 "$URL"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 v.mp4)
          python3 - <<'EOF'
          import os, json, subprocess
          dur = float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","csv=p=0","v.mp4"]).decode())
          n = int(os.environ["N"]); i = int(os.environ["I"])
          L = dur / n; start = i * L
          subprocess.run(["ffmpeg","-v","error","-ss",str(start),"-t",str(L + 2),"-i","v.mp4","-ac","1","-ar","16000","a.wav"], check=True)
          from faster_whisper import WhisperModel
          m = WhisperModel(os.environ["MODEL"], device="cpu", compute_type="int8", cpu_threads=4)
          segs, _ = m.transcribe("a.wav", beam_size=1, vad_filter=True, language="en")
          out = []
          for s in segs:
              if s.start >= L: break
              out.append({"start": round(s.start + start, 2), "end": round(s.end + start, 2), "text": s.text.strip()})
          json.dump(out, open(f"part{i:02d}.json", "w"))
          print("part", i, "segments", len(out))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: part${{ matrix.shard }}
          path: part*.json
